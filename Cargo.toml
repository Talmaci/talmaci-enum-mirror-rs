[package]
name = "talmaci-enum-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Derive bidirectional conversions between enums with matching unit variants"
readme = "README.md"
repository = "https://github.com/Talmaci/talmaci-enum-mirror-rs"
license = "MIT OR Apache-2.0"
keywords = ["enum", "derive", "conversion", "proc-macro"]
categories = ["rust-patterns"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"
